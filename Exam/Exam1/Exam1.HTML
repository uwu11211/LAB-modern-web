<!DOCTYPE html>
<html lang="en">

<head>
    <!--ข้อมูลเบื้องหลังของเว็บ-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครงาน</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-box">
        <h1>สมัคร</h1>
        <p class="subtitle">ง่ายและเร็ว</p>
    
    <div class="row">
        <input type="text" placeholder="ชื่อ">
        <input type="text" placeholder="นามสกุล">
    </div>
        <input type="text" placeholder="เบอร์โทรศัพท์หรืออีเมล">
        <input type="password" placeholder="รหัสผ่านใหม่">
        <input type="password" placeholder="ยืนยันรหัสผ่าน">
        <p class="subtitle">วันเกิดของคุณ</p>
    
    <label>วันเกิด</label>
    <div class="row">
        <select><option>วัน</option><option>1</option><option>2</option></select>
        <select><option>เดือน</option><option>ม.ค.</option><option>ก.พ.</option></select>
        <select><option>ปี</option><option>2560</option><option>2561</option></select>
    </div>

    <label>เพศ</label>
    <div class="row">
        <label class="gender">หญิง
            <input type="radio" name="gender"></label>
        <label class="gender">ชาย 
            <input type="radio" name="gender"></label>
    </div>

    <p class="subtitle">เมื่อคลิก สมัคร แสดงว่าคุณยอทมรับข้อกำหนด นโยบายข้อมูล และ นโยบายคุกกี้ของเรา คุณอาจได้รับการแจ้งเตือนทาง SMS จากเรา และ สามารถเลือกไม่รับได้ในภายหลัง</p>

    <button class="submit-btn">สมัคร</button>
</div>
</body>

</html>
