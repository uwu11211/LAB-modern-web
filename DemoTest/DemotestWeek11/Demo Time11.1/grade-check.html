<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>Grade Check</title>
</head>

<!-- อาจจะออกสอบนะ กันลืม :D -->
<body>

  <button onclick="checkGrade()">Run Code</button>
  <div id="output" style="white-space: pre-line; background-color: #1e1e1e; color: #fff;"></div>

  <script>
    function checkGrade() {
      console.clear();

      let score = Math.floor(Math.random() * 101);

      let grade = "";
      let status = "";

      if (score >= 80) {
        grade = "A";
      } else if (score >= 70) {
        grade = "B";
      } else if (score >= 60) {
        grade = "C";
      } else if (score >= 50) {
        grade = "D";
      } else {
        grade = "F";
      }

      if (score >= 50) {
        status = "ผ่าน";
      } else {
        status = "ไม่ผ่าน";
      }

      let resultText = `คะแนนที่สุ่มได้: ${score}\nเกรด: ${grade}\nผลสอบ: ${status}`;

      document.getElementById("output").textContent = resultText;

      console.log(`คะแนนที่สุ่มได้: ${score}`);
      console.log(`เกรด: ${grade}`);
      console.log(`ผลสอบ: ${status}`);
    }
  </script>

</body>

</html>
